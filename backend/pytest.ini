[pytest]
# tests/test_news_fetch.py is a manual diagnostic SCRIPT, not a unit test. It
# defines `async def test_basic_news_fetch()` alongside an `async def main()`
# and makes live network calls to the news providers. pytest only collects it
# because of its filename.
#
# It has failed on every CI run since it was added — "async def functions are
# not natively supported" — which is why the Backend check has been permanently
# red and everyone learned to merge past it. Installing pytest-asyncio would
# make it RUN, which is worse: live third-party fetches inside CI are flaky by
# construction and would fail on provider rate limits rather than on our code.
#
# Excluded so the check reflects the 208-test unit suite and a red X means
# something again. To run it deliberately:
#     cd backend && python tests/test_news_fetch.py
addopts = --ignore=tests/test_news_fetch.py

testpaths = tests
